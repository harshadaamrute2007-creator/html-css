<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Student Registration</h1>

    <form class="registration-form" action="#" method="post" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" placeholder="e.g. Jane Doe" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>

      <button type="submit" class="btn">Submit</button>
    </form>

    <p class="note">This is a simple demo form — form submissions are not sent anywhere.</p>
  </main>
</body>
</html>
