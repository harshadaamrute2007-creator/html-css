<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greatest of Two Numbers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .find-greatest {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .find-greatest:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
        }

        .find-greatest:active {
            transform: translateY(0);
        }

        .reset-btn {
            background: #e74c3c;
            color: white;
        }

        .reset-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 5px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result p {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
        }

        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Greatest of Two Numbers</h1>
        
        <div class="button-group">
            <button class="find-greatest" onclick="findGreatest()">Find Greatest</button>
            <button class="reset-btn" onclick="resetResult()">Reset</button>
        </div>

        <div class="result" id="resultDiv">
            <p>Number 1: <span id="num1"></span></p>
            <p>Number 2: <span id="num2"></span></p>
            <p>Greatest Number:</p>
            <div class="result-value" id="greatest"></div>
        </div>
    </div>

    <script>
        // Function to find the greatest of two numbers
        function findGreatest() {
            // Prompt user to enter first number
            let num1 = prompt("Enter the first number:");
            
            // Check if user cancelled or entered nothing
            if (num1 === null || num1 === "") {
                alert("Please enter a valid number!");
                return;
            }
            
            // Convert to number
            num1 = parseFloat(num1);
            
            // Check if input is a valid number
            if (isNaN(num1)) {
                alert("Please enter a valid number!");
                return;
            }
            
            // Prompt user to enter second number
            let num2 = prompt("Enter the second number:");
            
            // Check if user cancelled or entered nothing
            if (num2 === null || num2 === "") {
                alert("Please enter a valid number!");
                return;
            }
            
            // Convert to number
            num2 = parseFloat(num2);
            
            // Check if input is a valid number
            if (isNaN(num2)) {
                alert("Please enter a valid number!");
                return;
            }
            
            // Find the greatest number using if-else
            let greatest;
            if (num1 > num2) {
                greatest = num1;
            } else if (num2 > num1) {
                greatest = num2;
            } else {
                greatest = num1; // Both numbers are equal
            }
            
            // Display the result
            displayResult(num1, num2, greatest);
        }

        // Function to display result on the page
        function displayResult(num1, num2, greatest) {
            document.getElementById('num1').textContent = num1;
            document.getElementById('num2').textContent = num2;
            document.getElementById('greatest').textContent = greatest;
            document.getElementById('resultDiv').classList.add('show');
        }

        // Function to reset the result
        function resetResult() {
            document.getElementById('resultDiv').classList.remove('show');
            document.getElementById('num1').textContent = '';
            document.getElementById('num2').textContent = '';
            document.getElementById('greatest').textContent = '';
        }
    </script>
</body>
</html>
